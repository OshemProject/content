name: Build flyers list

on:
  push:
    paths:
      - 'flyers/**'
      - '.github/workflows/build-flyers-list.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate flyers.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("flyers")
          allowed = {".jpg", ".jpeg", ".png", ".webp", ".gif"}

          files = sorted(
              [
                  p.name
                  for p in folder.iterdir()
                  if p.is_file() and p.suffix.lower() in allowed
              ],
              reverse=True
          )

          Path("flyers.json").write_text(
              json.dumps(files, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit flyers.json
        shell: bash
        run: |
          if git diff --quiet -- flyers.json; then
            echo "flyers.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flyers.json
          git commit -m "Update flyers archive"
          git push
